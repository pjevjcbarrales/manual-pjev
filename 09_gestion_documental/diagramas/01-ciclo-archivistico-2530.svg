<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1040" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Clasificación y ciclo archivístico del piloto 2530</title>
  <desc id="descripcion">Versión ajustada del esquema del analista. CGCA y CADIDO versionados se relacionan con expedientes e inventarios. La referencia 2530 señala dos años en trámite, ocho en concentración y destino histórico. Las transferencias requieren inventario, validación y recepción. No hay destrucción automática por transcurso del tiempo.</desc>
  <defs><marker id="flecha" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7a867c"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#24382b}.titulo{font-size:24px;font-weight:700}.cab{font-size:20px;font-weight:700}.txt{font-size:18px}.nota{font-size:16px;fill:#536354}.linea{fill:none;stroke:#7a867c;stroke-width:2;marker-end:url(#flecha)}</style>
  <rect width="1000" height="1040" rx="12" fill="#fbfaf7"/>
  <text x="40" y="40" class="titulo">1. Clasificación y ciclo de vida documental</text>
  <text x="40" y="67" class="nota">Base del analista · Ajuste de alcance DGA–2530–Contabilidad · 29-10-2026</text>
  <rect x="50" y="95" width="400" height="110" rx="10" fill="#edf2e7" stroke="#93a67e" stroke-width="2"/>
  <text x="250" y="128" text-anchor="middle" class="cab">CGCA · Clasificación</text>
  <text x="250" y="158" text-anchor="middle" class="txt">Serie/subserie + versión del instrumento</text>
  <text x="250" y="185" text-anchor="middle" class="nota">Clasifica el asunto; no determina el anaquel</text>
  <rect x="550" y="95" width="400" height="110" rx="10" fill="#fff4da" stroke="#c9a35f" stroke-width="2"/>
  <text x="750" y="128" text-anchor="middle" class="cab">CADIDO · Disposición</text>
  <text x="750" y="158" text-anchor="middle" class="txt">Valores, plazos por fase y destino</text>
  <text x="750" y="185" text-anchor="middle" class="nota">Regla documentada y versión aplicable</text>
  <path d="M250 205V230H400V250" class="linea"/>
  <path d="M750 205V230H600V250" class="linea"/>
  <rect x="250" y="250" width="500" height="85" rx="10" fill="#183125"/>
  <text x="500" y="284" text-anchor="middle" class="cab" style="fill:#fff">Expedientes e inventarios</text>
  <text x="500" y="313" text-anchor="middle" class="txt" style="fill:#e9efe4">Identidad, productor, índice y clasificación</text>
  <path d="M500 335V365" class="linea"/>
  <rect x="250" y="365" width="500" height="85" rx="10" fill="#e5effd" stroke="#7897bd" stroke-width="2"/>
  <text x="500" y="399" text-anchor="middle" class="cab">Archivo de Trámite</text>
  <text x="500" y="429" text-anchor="middle" class="txt">2 años de referencia · CADIDO 2530</text>
  <path d="M500 450V500" class="linea"/>
  <text x="520" y="480" class="nota">Cierre y condiciones de cómputo validados</text>
  <rect x="250" y="500" width="500" height="85" rx="10" fill="#fff" stroke="#9da99f" stroke-width="2"/>
  <text x="500" y="533" text-anchor="middle" class="cab">Transferencia primaria</text>
  <text x="500" y="563" text-anchor="middle" class="txt">Inventario · entrega y recepción acreditadas</text>
  <path d="M500 585V615" class="linea"/>
  <rect x="250" y="615" width="500" height="85" rx="10" fill="#e5effd" stroke="#7897bd" stroke-width="2"/>
  <text x="500" y="649" text-anchor="middle" class="cab">Archivo de Concentración</text>
  <text x="500" y="679" text-anchor="middle" class="txt">8 años de referencia · CADIDO 2530</text>
  <path d="M500 700V750" class="linea"/>
  <text x="520" y="730" class="nota">Revisión del destino e impedimentos</text>
  <rect x="250" y="750" width="500" height="85" rx="10" fill="#fff" stroke="#9da99f" stroke-width="2"/>
  <text x="500" y="783" text-anchor="middle" class="cab">Valoración y transferencia secundaria</text>
  <text x="500" y="813" text-anchor="middle" class="txt">Procedimiento, autorización y recepción aplicables</text>
  <path d="M500 835V875" class="linea"/>
  <rect x="250" y="875" width="500" height="85" rx="10" fill="#e4f4e8" stroke="#76a480" stroke-width="2"/>
  <text x="500" y="909" text-anchor="middle" class="cab">Archivo Histórico</text>
  <text x="500" y="939" text-anchor="middle" class="txt">Destino marcado para las entradas 2530 revisadas</text>
  <text x="40" y="995" class="nota">Fuente: CADIDO recibido, pp. 36–37. Ratificar versión vigente y eventos de cómputo.</text>
  <text x="40" y="1021" class="nota">Otras series seguirán su propia regla de disposición. Cumplir plazos no ejecuta baja ni transferencia.</text>
</svg>
